# Retrieval + gating configuration (versioned alongside code).
retrieval:
  top_k_vector: 10
  top_k_bm25: 10
  rrf_k: 60
  rerank_top_n: 5

chunking:
  size_tokens: 700
  overlap_tokens: 100

# CI eval gate — build fails if any metric drops below these thresholds.
# Calibrated to the measured baseline on the corpus (4 Azure Learn docs, 18 golden
# QA pairs): faithfulness ~0.87, answer_relevancy ~0.85, context_precision 1.00.
# Thresholds sit just below baseline so regressions fail but the baseline passes.
eval_thresholds:
  faithfulness: 0.80
  answer_relevancy: 0.78
  context_precision: 0.80
