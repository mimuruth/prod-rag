# Retrieval + gating configuration (versioned alongside code).
retrieval:
  top_k_vector: 10
  top_k_bm25: 10
  rrf_k: 60
  rerank_top_n: 5

chunking:
  size_tokens: 700
  overlap_tokens: 100

# CI eval gate — build fails if any metric drops below these thresholds.
# Calibrated to the measured baseline on the demo corpus (faithfulness ~0.75-0.83,
# answer_relevancy ~0.79, context_precision 1.00). Thresholds include margin for
# run-to-run variance on the tiny single-doc corpus; tighten them as the corpus grows.
eval_thresholds:
  faithfulness: 0.70
  answer_relevancy: 0.70
  context_precision: 0.80
