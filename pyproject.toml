[project]
name = "prod-rag"
version = "0.1.0"
description = "Production-grade RAG with hybrid retrieval, reranking, citation enforcement, and CI-gated evaluation."
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-community",
    "langgraph",
    "chromadb",
    "rank-bm25",
    "sentence-transformers",
    "pypdf",
    "openai",
    "ragas",
    "langfuse",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
